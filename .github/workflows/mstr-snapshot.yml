name: MSTR snapshot

# Writes a small JSON snapshot (delayed MSTR quote + BTC, 5d of 5-minute bars) to the
# `data` branch. The web app reads it from raw.githubusercontent.com (CORS-open).
# Read-only public quote endpoints only. No secrets are used.

on:
  schedule:
    - cron: "*/5 9-23 * * 1-5"   # every ~5 min across US pre/regular/post hours (UTC)
    - cron: "17 * * * *"         # hourly otherwise (weekends, overnight)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mstr-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshot
        run: node scripts/update-mstr.mjs out/mstr.json
      - name: Publish to data branch (fast-forward commits; history squashed daily)
        run: |
          set -e
          cp out/mstr.json /tmp/mstr.json
          git config user.name "mstr-snapshot[bot]"
          git config user.email "mstr-snapshot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1 && [ "$(date -u +%H)" != "08" ]; then
            git fetch --depth=1 origin data
            git checkout -q -B data FETCH_HEAD
            mkdir -p data
            cp /tmp/mstr.json data/mstr.json
            git add data/mstr.json
            git commit -q -m "MSTR snapshot $(date -u +%FT%TZ)"
            git push origin HEAD:data
          else
            # first run, or the 08:xx UTC squash: one fresh root commit keeps the branch small
            git checkout -q --orphan data-tmp
            git rm -rf --quiet . || true
            mkdir -p data
            cp /tmp/mstr.json data/mstr.json
            git add data/mstr.json
            git commit -q -m "MSTR snapshot $(date -u +%FT%TZ)"
            git push -f origin HEAD:data
          fi
      - name: Purge jsDelivr copy (best effort)
        run: curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/data/mstr.json" || true
