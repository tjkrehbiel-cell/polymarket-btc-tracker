<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTC Bets">
  <meta name="description" content="Live, read-only odds for Polymarket Bitcoin markets.">
  <title>Polymarket BTC</title>
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/") && path.split("/").pop().indexOf(".") === -1) {
        location.replace(path + "/" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div id="app" class="app">
    <div id="markets-root"></div>
    <div id="mstr-root" hidden></div>
  </div>

  <nav id="tabs" class="tabs" aria-label="Sections">
    <button type="button" class="tab active" data-tab="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Markets</span></button>
    <button type="button" class="tab" data-tab="mstr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg><span>MSTR mNAV</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-sheet-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" class="icon-btn" data-sheet-close aria-label="Close">&times;</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="app.js?v=5" defer></script>
  <script src="mstr.js?v=5" defer></script>
</body>
</html>
